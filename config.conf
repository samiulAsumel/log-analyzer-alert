# ════════════════════════════════════════════════════════════════════════════
# Automated Log Analyzer & Alert System — Configuration  v2.0.0
# Edit this file to match your environment.  Sourced by all log scripts.
# ════════════════════════════════════════════════════════════════════════════

# ── Log file paths ────────────────────────────────────────────────────────────
SYSLOG="/var/log/messages"              # RHEL/Rocky: messages | Ubuntu: syslog
AUTH_LOG="/var/log/secure"              # RHEL/Rocky: secure   | Ubuntu: auth.log
NGINX_ACCESS="/var/log/nginx/access.log"
NGINX_ERROR="/var/log/nginx/error.log"
MYSQL_ERROR="/var/log/mysql/error.log"
MYSQL_SLOW="/var/log/mysql/slow.log"
APP_LOG="/var/log/myapp/application.log"
APP_NAME="myapp"                        # Used in report subject lines

# ── Alert patterns (ERE regex, case-insensitive) ─────────────────────────────
CRITICAL_PATTERNS="Out of memory|oom-kill|kernel panic|segfault|disk full|No space left|RAID degraded"
ERROR_PATTERNS="error|critical|fatal|exception|traceback|panic|abort|coredump"
SECURITY_PATTERNS="Failed password|Invalid user|POSSIBLE BREAK-IN|authentication failure|bad packet"
WARNING_PATTERNS="warning|warn|deprecated|timeout|refused|reset by peer"

# ── Thresholds ────────────────────────────────────────────────────────────────
MAX_FAILED_LOGINS=5         # per IP in CHECK_INTERVAL minutes → SECURITY_CRITICAL
MAX_404_PER_IP=50           # 404s from one IP in CHECK_INTERVAL → possible scanner
MAX_5XX_COUNT=20            # total 5xx errors in CHECK_INTERVAL → web alert
MAX_SLOW_QUERIES=50         # slow queries per hour → DB alert
MAX_OOM_EVENTS=1            # OOM kills per interval → always critical
MAX_UNIQUE_ERRORS=30        # unique error patterns per interval → app alert
MAX_RESPONSE_MS=5000        # nginx $request_time in ms → slow request flag

# ── Brute-force response ──────────────────────────────────────────────────────
AUTO_BLOCK_IP=false         # true = add offending IP to firewalld (requires root)
BLOCK_ZONE="public"         # firewalld zone to add the block rule
HOSTS_DENY=false            # true = add to /etc/hosts.deny (legacy TCP wrappers)
WHITELIST_IPS="127.0.0.1 ::1"   # space-separated; never block these IPs

# ── Alert settings ────────────────────────────────────────────────────────────
ALERT_EMAIL="admin@company.com"
ALERT_FROM="loganalyzer@$(hostname -f 2>/dev/null || echo server)"

# Alert delivery method — one or more of: email | slack | teams
# Comma/space-separated for multiple channels. Use "email,slack" to send both.
# PagerDuty fires automatically for CRITICAL/HIGH if PAGERDUTY_KEY is set.
ALERT_METHOD="email"

# Slack
SLACK_WEBHOOK=""            # https://hooks.slack.com/services/...

# Microsoft Teams (Incoming Webhook connector URL)
TEAMS_WEBHOOK=""            # https://outlook.office.com/webhook/...

# PagerDuty Events API v2 integration key (fires on CRITICAL + HIGH if set)
PAGERDUTY_KEY=""            # PagerDuty Events API v2 integration key

# Rate-limiting: don't repeat HIGH alert for same key within N minutes
HIGH_ALERT_COOLDOWN=30      # minutes

# Digest schedule (cron expression used by install.sh)
DIGEST_CRON="0 7 * * *"    # 07:00 AM daily

# ── Analysis ──────────────────────────────────────────────────────────────────
CHECK_INTERVAL=15           # minutes between log_analyzer.sh runs (cron interval)
ANALYZER_CRON="*/15 * * * *"  # cron expression matching CHECK_INTERVAL

# ── State and storage ─────────────────────────────────────────────────────────
STATE_DIR="/var/lib/loganalyzer"
POSITION_DIR="${STATE_DIR}/positions"   # inode+offset tracking per log
FINDINGS_DIR="${STATE_DIR}/findings"    # pipe-delimited findings per run
COOLDOWN_DIR="${STATE_DIR}/cooldowns"   # rate-limit timestamps
BLOCK_LOG="${STATE_DIR}/blocked_ips.log"

# ── Logging ───────────────────────────────────────────────────────────────────
LOG_DIR="/var/log/loganalyzer"
LOG_FILE="${LOG_DIR}/analyzer.log"
DIGEST_LOG="${LOG_DIR}/digest.log"
LOG_MAX_DAYS=30             # rotate/delete analyzer logs older than N days

# ── Log archival ──────────────────────────────────────────────────────────────
ARCHIVE_ENABLED=true
ARCHIVE_DIR="/var/log/loganalyzer/archive"
ARCHIVE_KEEP_DAYS=90        # keep compressed archives N days
COMPRESS_LOGS_OLDER_DAYS=7  # compress server logs older than N days

# ── SIEM / JSON export ────────────────────────────────────────────────────────
# If set, each run also writes a JSON findings file alongside the pipe-delimited one.
# Useful for forwarding to Splunk, Elasticsearch, or any SIEM via file-beat/fluentd.
JSON_EXPORT_ENABLED=true
JSON_EXPORT_DIR="${STATE_DIR}/findings_json"

# ── Journald / systemd journal ────────────────────────────────────────────────
# Lines to scan from journald per run (analyze_journal module)
JOURNAL_LINES=2000

# ── Version ───────────────────────────────────────────────────────────────────
VERSION="2.0.0"
