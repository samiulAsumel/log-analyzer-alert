name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint all shell scripts
        run: |
          find . -name "*.sh" -not -path "./.git/*" | sort | while read -r f; do
            echo "Checking: $f"
            shellcheck -S warning -e SC1090,SC1091,SC2034,SC2154 "$f"
          done

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install bc (used by nginx module)
        run: sudo apt-get install -y bc

      - name: Run test suite
        run: bash tests/test_analyzer.sh --verbose

  syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax on all scripts
        run: |
          find . -name "*.sh" -not -path "./.git/*" | sort | while read -r f; do
            bash -n "$f" && echo "OK: $f" || { echo "SYNTAX ERROR: $f"; exit 1; }
          done

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          # Fail if any actual credential-looking strings are committed
          if grep -rE \
            '(password|passwd|secret|api[_-]?key|webhook)[[:space:]]*=[[:space:]]*"[^"$]{8,}"' \
            --include="*.sh" --include="*.conf" \
            --exclude-dir=".git" .; then
            echo "Potential hardcoded secret found — review before merging"
            exit 1
          fi
          echo "No hardcoded secrets detected"

      - name: Check file permissions on scripts
        run: |
          find . -name "*.sh" -not -path "./.git/*" | while read -r f; do
            if [[ ! -x "$f" ]]; then
              echo "WARNING: $f is not executable"
            fi
          done
